; MakerEDU ESP32-S3+ (Uno form factor) with MeshCore Shield
[MKE_s3_plus]
extends = esp32_base
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/mke_s3_plus
  -D MKE_S3_PLUS
  -D ESP32_CPU_FREQ=80
  ; SPI LoRa SX1262
  -D P_LORA_NSS=14
  -D P_LORA_MOSI=13
  -D P_LORA_MISO=12
  -D P_LORA_SCLK=11
  -D P_LORA_BUSY=10
  -D P_LORA_RESET=5
  -D P_LORA_DIO_1=4
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=0 ; Ra01SH uses XTAL
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; I2C Board (OLED & Onboard port)
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  ; User Button
  -D PIN_USER_BTN=0
  ; Peripheral Power Switch (P-FET)
  -D PIN_VEXT_EN=21
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_GPS_EN=21
  -D PIN_GPS_EN_ACTIVE=HIGH
  ; GPS Module (GP-02 UART)
  -D PIN_GPS_RX=47
  -D PIN_GPS_TX=48
  ; Battery Voltage Read
  -D PIN_VBAT_READ=1       ; Đo điện áp pin tại GPIO 1 qua cầu phân áp 2x100k
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/mke_s3_plus>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:MKE_s3_plus_companion_radio_ble]
extends = MKE_s3_plus
build_flags =
  ${MKE_s3_plus.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456   ; fixed PIN if display is not detected
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${MKE_s3_plus.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${MKE_s3_plus.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:MKE_s3_plus_companion_radio_usb]
extends = MKE_s3_plus
build_flags =
  ${MKE_s3_plus.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D ENABLE_USB_INTERFACE
build_src_filter = ${MKE_s3_plus.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${MKE_s3_plus.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:MKE_s3_plus_companion_radio_wifi]
extends = MKE_s3_plus
build_flags =
  ${MKE_s3_plus.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
