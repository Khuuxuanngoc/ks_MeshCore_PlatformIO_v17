lib_deps =
  ${MKE_s3_plus.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:MKE_s3_plus_repeater]
extends = MKE_s3_plus
build_flags =
  ${MKE_s3_plus.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"MKE S3+ Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${MKE_s3_plus.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${MKE_s3_plus.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

